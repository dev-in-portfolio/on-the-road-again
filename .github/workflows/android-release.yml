name: Android release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: stable
        type: choice
        options: [stable, beta]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      OTRA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.OTRA_ANDROID_KEYSTORE_PASSWORD }}
      OTRA_ANDROID_KEY_ALIAS: ${{ secrets.OTRA_ANDROID_KEY_ALIAS }}
      OTRA_ANDROID_KEY_PASSWORD: ${{ secrets.OTRA_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run cap:sync
      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.OTRA_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/otra-release.jks"
          echo "OTRA_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/otra-release.jks" >> "$GITHUB_ENV"
      - name: Build signed APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify APK and publish release
        env:
          CHANNEL: ${{ inputs.channel }}
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$APK")
          VERSION=$(sed -n "s/.*versionName[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" android/app/build.gradle | head -1)
          BUILD=$(sed -n "s/.*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p" android/app/build.gradle | head -1)
          TAG="android-v${VERSION}-${CHANNEL}"
          RELEASE_ARGS=("$APK#OTRA Android ${VERSION} (${BUILD})" --title "OTRA Android ${VERSION} (${CHANNEL})" --notes "SHA-256: ${SHA}\nSize: ${SIZE} bytes\nBuild: ${BUILD}" --target "$GITHUB_SHA")
          if [ "$CHANNEL" = beta ]; then RELEASE_ARGS+=(--prerelease); fi
          gh release create "$TAG" "${RELEASE_ARGS[@]}"
          echo "APK_SHA256=$SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "APK_SIZE=$SIZE" >> "$GITHUB_STEP_SUMMARY"
          echo "APK_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/app-release.apk" >> "$GITHUB_STEP_SUMMARY"
