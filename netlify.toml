[build]
  command = "npm run build"
  publish = "dist"

[dev]
  targetPort = 3000

[functions]
  directory = "netlify/functions"

# Proxy API calls to serverless functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback — all other routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
